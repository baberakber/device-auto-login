<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign-in failed</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10141a;
      color: #e8eef5;
      font-family: "Segoe UI", sans-serif;
    }
    main {
      width: min(32rem, calc(100% - 2rem));
    }
    a {
      color: #9ec1ff;
    }
  </style>
</head>
<body>
  <main>
    <h1>Could not sign in</h1>
    <p>{{ message }}</p>
    <p><a href="/">Back</a></p>
  </main>
</body>
</html>
